[workspace]
resolver = "2"
members = ["crates/modscript", "crates/modengine", "crates/modengine-cli", "crates/modengine-editor"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# quad-snd with a mix hook for Mod Engine's software mixer (see vendor/quad-snd/README.mod-engine.md)
[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }
