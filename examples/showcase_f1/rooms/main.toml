# Una sala con muros de tiles, fosos (capa de colisión 2), enemigos que siguen un campo de
# flujo, una torreta que lanza rayos y un panel con recorte y texto enriquecido.
width = 560
height = 272
background = "#323e4f"

code = '''
global.nav = mp_grid_create(0, 0, 30, 17, 16, 16)
mp_grid_add_tilemap(global.nav, "Muros")
mp_grid_add_instances(global.nav, Foso)
var j = find(Jugador, 0)
global.flujo = mp_flow_create(global.nav, j.x, j.y)
// la vista empieza 24 px a la derecha: el recorte en coordenadas de room la sigue
camera_set(24, 0)
'''

