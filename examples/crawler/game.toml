# Cripta de Naipes: un dungeon crawler en primera persona con combate de cartas por turnos.
# Guía: docs/plantilla-crawler.md
[game]
name = "Cripta de Naipes"
start_room = "title"
rooms = ["title", "crypt"]

[display]
width = 640
height = 360
scale = 2
letterbox = "#272736"
font_size = 16

[localization]
default = "es"
fallback = "en"

[android]
virtual_pad = "dpad"
virtual_buttons = ["enter:OK", "q:Q", "e:E", "escape:X"]

# Paleta: Pear36 de PineappleOnPizza (lospec.com). '.' es transparente.
