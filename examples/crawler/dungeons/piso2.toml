# piso2: preview with
#   modengine dungeon examples/crawler dungeons/piso2.toml --seed 1,2,3 --png /tmp/piso2.png
width = 36
height = 36
rooms = [7, 8]
room_size = { min = [3, 3], max = [6, 5] }
rect_weight = 1
spacing = 2
spread = 0.5
extra_edges = 0.2
corridor = "astar"

[[templates]]
name = "cripta"
weight = 2
rotate = true
tags = ["normal"]
rows = '''
  ...
  .E.
.......
.E.C.E.
.......
  ...
'''

[[templates]]
name = "salon"
weight = 2
rotate = true
tags = ["normal"]
rows = '''
#######
#.....#
#.E.E.#
D.....D
#..C..#
#######
'''

[[templates]]
name = "capilla"
weight = 1
max = 1
tags = ["fuente"]
rows = '''
#####
#...#
D.F.D
#...#
#####
'''

[[events]]
type = "enemy"
count = [4, 5]
where = "room"
marker = "E"
min_distance_from_start = 5
exclude_start_room = true

[[events]]
type = "enemy"
count = [1, 2]
where = "corridor"
min_distance_from_start = 6
min_spacing = 3

[[events]]
type = "chest"
count = [2, 3]
where = "dead_end"
marker = "C"

[[events]]
type = "fountain"
where = "room"
marker = "F"
on_main_path = false
