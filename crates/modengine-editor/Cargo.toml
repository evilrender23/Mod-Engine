[package]
name = "modengine-editor"
description = "Visual editor for Mod Engine projects: rooms, objects, sprites, sounds and scripts"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "modeditor"
path = "src/main.rs"

[dependencies]
modengine = { path = "../modengine" }
modscript = { path = "../modscript" }
eframe = "0.37"
toml = "0.8"
# same version `toml` already uses: edits game.toml/sprites keeping comments (palettes)
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# gif + jpeg: OpenGameArt thumbnails and previews (Tienda de assets)
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
# already built for the exporter: unzip OpenGameArt packs (store_zip.rs)
flate2 = "1"
crc32fast = "1"
# native folder picker ("Usar el diálogo del sistema"): on Linux it talks to the XDG desktop
# portal through libdbus loaded at runtime (no build-time system libraries, falls back to
# zenity); on Windows/macOS the OS dialogs. The built-in browser is always available.
rfd = "0.17"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
